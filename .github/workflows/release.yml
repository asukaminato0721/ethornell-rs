name: Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && 'rolling' || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev pkg-config
      - name: Build
        run: cargo build --release --locked -p ethornell-cli --bin ethornell
      - name: Package
        run: |
          mkdir -p dist
          test -f target/release/ethornell
          tar -C target/release -czf dist/ethornell-linux-${{ matrix.arch }}.tar.gz ethornell
      - uses: actions/upload-artifact@v4
        with:
          name: ethornell-linux-${{ matrix.arch }}
          path: dist/ethornell-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p ethornell-cli --bin ethornell --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          test -f target/${{ matrix.target }}/release/ethornell
          tar -C target/${{ matrix.target }}/release -czf dist/ethornell-macos-${{ matrix.arch }}.tar.gz ethornell
      - uses: actions/upload-artifact@v4
        with:
          name: ethornell-macos-${{ matrix.arch }}
          path: dist/ethornell-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p ethornell-cli --bin ethornell
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          if (-not (Test-Path target/release/ethornell.exe)) { throw 'ethornell.exe was not built' }
          Compress-Archive -Path target/release/ethornell.exe -DestinationPath dist/ethornell-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ethornell-windows-x86_64
          path: dist/ethornell-windows-x86_64.zip
          if-no-files-found: error

  rolling:
    name: Publish rolling prerelease
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ethornell-rolling-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          files=(dist/ethornell-linux-{x86_64,aarch64}.tar.gz
                 dist/ethornell-macos-{arm64,x86_64}.tar.gz
                 dist/ethornell-windows-x86_64.zip)
          for file in "${files[@]}"; do test -f "$file"; done

          if gh release view pre-release >/dev/null 2>&1; then
            gh release delete pre-release --cleanup-tag --yes
          fi

          gh release create pre-release "${files[@]}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "ethornell rolling (${GITHUB_SHA::7})" \
            --notes "Rolling build from commit $GITHUB_SHA."

  release:
    name: Publish versioned release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
